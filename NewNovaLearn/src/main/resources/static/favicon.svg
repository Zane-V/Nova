<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Graduation cap: board -->
  <polygon points="32,14 56,26 32,38 8,26" fill="#ffffff" opacity="0.97"/>
  <!-- Graduation cap: left side of brim shadow -->
  <polygon points="32,38 56,26 56,30 32,42" fill="#e0e7ff" opacity="0.6"/>
  <!-- Tassel cord -->
  <line x1="48" y1="26" x2="48" y2="40" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="48" cy="41.5" r="3" fill="#fde68a"/>
  <!-- Diploma scroll under cap -->
  <rect x="20" y="40" width="24" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
  <line x1="24" y1="44" x2="40" y2="44" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="47" x2="36" y2="47" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/>
</svg>
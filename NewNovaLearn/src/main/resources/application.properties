spring.application.name=novalearn

# Railway injects PORT dynamically — must bind to it
server.port=${PORT:8080}

# Template caching — disabled locally via THYMELEAF_CACHE=false, enabled in prod
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Multipart file upload limits (up to 1 GB for video uploads)
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# Upload directory (relative to the working directory)
app.upload.dir=uploads

# Suppress JPA open-in-view warning
spring.jpa.open-in-view=false

# Import .env file configuration
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL Auto — set DDL_AUTO=update on Railway (or 'validate' once stable)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
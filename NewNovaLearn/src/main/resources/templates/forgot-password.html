<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NovaLearn</title>
    <meta name="description" content="Reset your NovaLearn account password.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .auth-card {
            background: white; border-radius: 20px; padding: 3rem 2.5rem;
            width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb; text-align: center;
        }
        .icon-wrap {
            width: 64px; height: 64px; border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white; font-size: 1.6rem; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; box-shadow: 0 8px 24px rgba(37,99,235,0.3);
        }
        h1 { font-size: 1.8rem; font-weight: 800; color: #1a1a2e; margin-bottom: 0.5rem; }
        p.subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }

        .input-wrapper { position: relative; margin-bottom: 1.5rem; }
        .input-wrapper i { position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 1.1rem; }
        .auth-input {
            width: 100%; padding: 0.85rem 1rem 0.85rem 3.25rem;
            border: 1.5px solid #e5e7eb; border-radius: 12px;
            font-family: 'Outfit', sans-serif; font-size: 0.95rem;
            color: #1a1a2e; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); outline: none; }

        .submit-btn {
            width: 100%; padding: 0.9rem; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white; font-size: 1.05rem; font-weight: 700; font-family: 'Outfit', sans-serif;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(37,99,235,0.3); margin-bottom: 1.5rem;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.4); }

        .auth-link { color: #2563eb; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
        .auth-link:hover { text-decoration: underline; }

        /* Dialog styling */
        .code-overlay {
            position: fixed; inset: 0; background: rgba(15, 15, 30, 0.6); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .code-dialog {
            background: white; border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 420px;
            box-shadow: 0 24px 60px rgba(37,99,235,0.2); text-align: center;
        }
        .code-boxes { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
        .code-box {
            width: 48px; height: 56px; border: 2px solid #e5e7eb; border-radius: 10px;
            font-size: 1.5rem; font-weight: 700; text-align: center; font-family: 'Outfit', sans-serif;
            color: #1a1a2e; background: #f8fafc; transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .code-box:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); background: white; }
        .code-box.filled { border-color: #2563eb; background: white; }

        .error-banner { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; padding: 0.85rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; text-align: left; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="icon-wrap"><i class="fas fa-lock"></i></div>
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email address and we'll send you a 6-digit code to reset your password.</p>

        <div th:if="${errorMessage}" class="error-banner">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:if="${codeSent == null or !codeSent}" th:object="${forgotPasswordForm}" th:action="@{/forgot-password}" method="POST">
            <div class="input-wrapper">
                <i class="far fa-envelope"></i>
                <input type="email" id="email" name="email" class="auth-input" th:field="*{email}" placeholder="Enter your email address" required>
            </div>
            <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Send Reset Code</button>
        </form>

        <p style="font-size:0.9rem; color:#6b7280; margin:0;">Remember your password? <a th:href="@{/login}" class="auth-link">Sign In</a></p>
    </div>

    <!-- Code Dialog -->
    <div th:if="${codeSent}" class="code-overlay">
        <div class="code-dialog">
            <div class="icon-wrap" style="width:56px;height:56px;font-size:1.4rem;margin:0 auto 1rem;"><i class="fas fa-shield-alt"></i></div>
            <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:0.5rem;">Check Your Email</h2>
            <p style="font-size:0.9rem; color:#6b7280; margin-bottom:1.5rem;">We've sent a 6-digit code to <strong th:text="${email}" style="color:#1a1a2e;">your email</strong>. Enter it below to continue.</p>

            <form th:action="@{/verify-code}" method="POST" id="codeForm">
                <input type="hidden" name="email" th:value="${email}">
                <input type="hidden" name="code" id="hiddenCode">

                <div class="code-boxes">
                    <input class="code-box" type="text" maxlength="1" inputmode="numeric">
                    <input class="code-box" type="text" maxlength="1" inputmode="numeric">
                    <input class="code-box" type="text" maxlength="1" inputmode="numeric">
                    <input class="code-box" type="text" maxlength="1" inputmode="numeric">
                    <input class="code-box" type="text" maxlength="1" inputmode="numeric">
                    <input class="code-box" type="text" maxlength="1" inputmode="numeric">
                </div>
                <button type="submit" class="submit-btn" style="margin-bottom:1rem;"><i class="fas fa-check-circle"></i> Verify Code</button>
            </form>
            <p style="font-size:0.85rem; color:#6b7280; margin:0;">Didn't receive it? <a th:href="@{/forgot-password}" class="auth-link">Resend code</a></p>
        </div>
    </div>

    <script>
        const boxes = document.querySelectorAll('.code-box');
        if (boxes.length) {
            boxes[0].focus();
            boxes.forEach((box, i) => {
                box.addEventListener('input', e => {
                    e.target.value = e.target.value.replace(/\D/, '');
                    if (e.target.value) {
                        box.classList.add('filled');
                        if (i < boxes.length - 1) boxes[i + 1].focus();
                    } else box.classList.remove('filled');
                    updateHiddenCode();
                });
                box.addEventListener('keydown', e => {
                    if (e.key === 'Backspace' && !box.value && i > 0) {
                        boxes[i - 1].focus(); boxes[i - 1].value = '';
                        boxes[i - 1].classList.remove('filled'); updateHiddenCode();
                    }
                });
                box.addEventListener('paste', e => {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
                    pasted.split('').forEach((ch, idx) => {
                        if (boxes[idx]) { boxes[idx].value = ch; boxes[idx].classList.add('filled'); }
                    });
                    if (boxes[pasted.length - 1]) boxes[pasted.length - 1].focus();
                    updateHiddenCode();
                });
            });
            document.getElementById('codeForm').addEventListener('submit', function (e) {
                if (document.getElementById('hiddenCode').value.length < 6) { e.preventDefault(); alert('Please enter all 6 digits.'); }
            });
        }
        function updateHiddenCode() {
            document.getElementById('hiddenCode').value = Array.from(document.querySelectorAll('.code-box')).map(b => b.value).join('');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${liveSession.title} + ' - NovaLearn Live'">Live Session</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #0f0f1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .live-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1.5rem; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; gap: 1rem; flex-wrap: wrap;
        }
        .live-topbar-left { display: flex; align-items: center; gap: 1rem; }
        .live-badge { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(239,68,68,0.2); color: #f87171; font-size: 0.78rem; font-weight: 700; padding: 0.3rem 0.75rem; border-radius: 999px; letter-spacing: 0.04em; }
        .live-badge::before { content: ''; width: 7px; height: 7px; background: #ef4444; border-radius: 50%; animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }
        .live-session-title { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
        .live-topbar-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .room-code-pill { font-family: monospace; font-size: 0.85rem; font-weight: 700; background: rgba(255,255,255,0.08); color: #a78bfa; padding: 0.35rem 0.85rem; border-radius: 8px; letter-spacing: 0.12em; cursor: pointer; border: 1px solid rgba(167,139,250,0.3); transition: background 0.2s; }
        .room-code-pill:hover { background: rgba(167,139,250,0.15); }
        .copy-toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 0.5rem 1.25rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; }
        .copy-toast.show { opacity: 1; }

        .jitsi-wrapper { flex: 1; position: relative; }
        #jitsi-container { width: 100%; height: 100%; }

        .end-btn { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); padding: 0.45rem 1rem; border-radius: 10px; font-family: 'Outfit',sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; transition: background 0.2s; }
        .end-btn:hover { background: rgba(239,68,68,0.3); }
        .leave-btn { background: rgba(255,255,255,0.06); color: #d1d5db; border: 1px solid rgba(255,255,255,0.1); padding: 0.45rem 1rem; border-radius: 10px; font-family: 'Outfit',sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; text-decoration: none; transition: background 0.2s; }
        .leave-btn:hover { background: rgba(255,255,255,0.12); }
    </style>
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

    <!-- Copy toast -->
    <div class="copy-toast" id="copyToast">Room code copied!</div>

    <!-- Top bar -->
    <div class="live-topbar">
        <div class="live-topbar-left">
            <span class="live-badge">LIVE</span>
            <span class="live-session-title" th:text="${liveSession.title}">Session Title</span>
            <span style="font-size:0.8rem; color:rgba(255,255,255,0.4);" th:text="${liveSession.subject}">Subject</span>
        </div>
        <div class="live-topbar-right">
            <a th:href="@{/dashboard}" class="leave-btn" title="Return to your dashboard">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
            <span class="room-code-pill" th:text="${liveSession.roomCode}" id="roomCodePill"
                  title="Click to copy" onclick="copyRoomCode()">ABCD1234</span>
            <a th:href="'https://meet.element.io/' + ${jitsiRoom}" target="_blank" class="leave-btn" title="Open video call in a separate tab">
                <i class="fas fa-external-link-alt"></i> Open in New Tab
            </a>
            <!-- End session button (host only) -->
            <form th:if="${isHost}" th:action="@{/end-session/{id}(id=${liveSession.id})}" method="POST" style="display:inline;">
                <button type="submit" class="end-btn" onclick="return confirm('Are you sure you want to end this session for everyone?');">
                    <i class="fas fa-stop-circle"></i> End Session
                </button>
            </form>
            <!-- Leave button (students) -->
            <a th:if="${!isHost}" th:href="@{/sessions}" class="leave-btn">
                <i class="fas fa-sign-out-alt"></i> Leave
            </a>
        </div>
    </div>

    <!-- Jitsi Meet iframe -->
    <div class="jitsi-wrapper">
        <div id="jitsi-container"></div>
    </div>

    <!-- Jitsi Meet External API -->
    <script src="https://meet.element.io/external_api.js"></script>
    <script th:inline="javascript">
        const jitsiRoom = /*[[${jitsiRoom}]]*/ 'defaultRoom';
        const displayName = /*[[${nickname}]]*/ 'Guest';

        const api = new JitsiMeetExternalAPI("meet.element.io", {
            roomName: jitsiRoom,
            parentNode: document.getElementById("jitsi-container"),
            width: "100%",
            height: "100%",
            userInfo: {
                displayName: displayName
            },
            configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: false,
                disableDeepLinking: true,
                prejoinPageEnabled: false,
                toolbarButtons: [
                    'microphone', 'camera', 'desktop', 'chat',
                    'raisehand', 'participants-pane', 'tileview', 'fullscreen'
                ]
            },
            interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                SHOW_BRAND_WATERMARK: false,
                SHOW_POWERED_BY: false,
                DEFAULT_BACKGROUND: '#0f0f1a',
                TOOLBAR_ALWAYS_VISIBLE: true
            }
        });
    </script>

    <script>
        function copyRoomCode() {
            const code = document.getElementById('roomCodePill').textContent.trim();
            navigator.clipboard.writeText(code).then(() => {
                const toast = document.getElementById('copyToast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }
    </script>
</body>
</html>

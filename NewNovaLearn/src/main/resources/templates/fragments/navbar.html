<!-- Reusable navbar fragment. Include with:
     <div th:replace="~{fragments/navbar :: navbar}"></div> -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg fixed-top" id="mainNavbar">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
            Nova Learning
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <i class="fas fa-bars"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <a class="nav-link" th:href="@{/}">Home</a>
                <a class="nav-link" th:href="@{/courses}">Courses</a>

                <th:block sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                    <a class="nav-btn" th:href="@{/register}">Get Started</a>
                </th:block>

                <th:block sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="fas fa-th-large me-1"></i>Dashboard</a>
                    <a class="nav-btn" th:href="@{/logout}"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
                </th:block>

            </ul>
        </div>

    </div>
</nav>
</body>
</html>

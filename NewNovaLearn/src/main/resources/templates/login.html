<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nova Learning</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="auth-card">

                    <div class="text-center mb-4">
                        <a th:href="@{/}" class="text-decoration-none">
                            <i class="fas fa-user-circle fa-4x text-primary mb-3"></i>
                        </a>
                        <h2>Welcome Back</h2>
                        <p>Login to continue learning.</p>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle me-1"></i>
                        <span th:text="${successMessage}">Account created successfully!</span>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-1"></i>
                        <span th:text="${errorMessage}">Invalid email or password.</span>
                    </div>

                    <form th:action="@{/login}" method="POST">

                        <div class="mb-3">
                            <label class="form-label">I am signing in as</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="role" id="login-role-student"
                                           value="STUDENT" required
                                           th:checked="${selectedRole == null || selectedRole == 'STUDENT'}">
                                    <label class="form-check-label" for="login-role-student">
                                        <i class="far fa-user me-1"></i>Student
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="role" id="login-role-lecturer"
                                           value="LECTURER" th:checked="${selectedRole == 'LECTURER'}">
                                    <label class="form-check-label" for="login-role-lecturer">
                                        <i class="fas fa-book-open me-1"></i>Lecturer
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${email}" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Enter your password" required>
                                <span class="input-group-text toggle-password" style="cursor:pointer;">
                                    <i class="far fa-eye"></i>
                                </span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Remember Me</label>
                            </div>
                            <a th:href="@{/forgot-password}">Forgot Password?</a>
                        </div>

                        <button type="submit" class="hero-btn w-100">Login</button>

                    </form>

                    <hr>

                    <p class="text-center">
                        Don't have an account?
                        <a th:href="@{/register}">Register Here</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</section>

<script src="/assets/js/script.js"></script>
</body>
</html>

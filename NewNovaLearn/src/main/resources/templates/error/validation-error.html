<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Validation Error - NovaLearn</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="max-width:600px; margin:2rem auto; padding:1.5rem; background:var(--card-bg); border:1px solid var(--border-color); border-radius:12px;">
        <h2 style="color:var(--danger-color, #dc2626);">Please fix the following errors</h2>
        <ul style="list-style:none; padding:0;">
            <li th:each="err : ${fieldErrors}" style="padding:0.3rem 0; color:var(--danger-color, #dc2626);">
                <strong th:text="${err.key}"></strong>: <span th:text="${err.value}"></span>
            </li>
        </ul>
        <a href="javascript:history.back()" class="btn btn-primary" style="margin-top:1rem;">Go Back</a>
    </div>
</body>
</html>

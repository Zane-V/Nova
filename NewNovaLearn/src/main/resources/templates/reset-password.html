<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - NovaLearn</title>
    <meta name="description" content="Set a new password for your NovaLearn account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Password strength bar */
        .strength-bar {
            height: 5px;
            border-radius: 3px;
            margin-top: 0.5rem;
            background: #eef0f7;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            border-radius: 3px;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }
        .strength-label {
            font-size: 0.78rem;
            color: #a0a5b1;
            margin-top: 0.3rem;
        }
        .rules-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .rules-list li {
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #a0a5b1;
            transition: color 0.2s;
        }
        .rules-list li.pass { color: #0ebc7f; }
        .rules-list li i { font-size: 0.7rem; }
    </style>
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <a th:href="@{/}" class="logo logo-center">
                    <div class="logo-icon"></div>
                    <span>NovaLearn</span>
                </a>
                <h1>Set New Password</h1>
                <p>Almost there! Choose a strong new password for your account.</p>
            </div>

            <!-- Error Banner -->
            <div th:if="${errorMessage}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; padding: 0.85rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 0.6rem;">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <!-- Field Errors -->
            <div th:if="${fieldErrors}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; padding: 0.85rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem;">
                <ul style="margin:0; padding-left:1.2rem;">
                    <li th:each="err : ${fieldErrors}" th:text="${err.key} + ': ' + ${err.value}"></li>
                </ul>
            </div>

            <!-- Password form -->
            <form th:if="${token != null}" th:object="${resetPasswordForm}" th:action="@{/reset-password}" method="POST" class="auth-form" id="resetForm">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password"
                               th:field="*{password}"
                               placeholder="Min. 8 characters" required minlength="8"
                               oninput="checkStrength(this.value)">
                        <button type="button" class="toggle-pwd" onclick="togglePwd('password', this)">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-label" id="strengthLabel"></div>
                    <ul class="rules-list" id="rulesList">
                        <li id="rule-len"><i class="fas fa-circle"></i> 8+ characters</li>
                        <li id="rule-upper"><i class="fas fa-circle"></i> Uppercase</li>
                        <li id="rule-num"><i class="fas fa-circle"></i> Number</li>
                        <li id="rule-special"><i class="fas fa-circle"></i> Special char</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                                th:field="*{confirmPassword}"
                                placeholder="Repeat new password" required minlength="8">
                        <button type="button" class="toggle-pwd" onclick="togglePwd('confirmPassword', this)">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div id="matchMsg" style="font-size:0.78rem; margin-top:0.35rem;"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <i class="fas fa-key" style="margin-right:0.5rem;"></i> Reset Password
                </button>
            </form>

            <!-- No valid token: prompt to restart -->
            <div th:if="${token == null}" style="text-align:center; padding: 1.5rem 0;">
                <i class="fas fa-exclamation-triangle" style="font-size:2rem; color:#f59e0b; display:block; margin-bottom:0.75rem;"></i>
                <p style="color:#6c757d; margin-bottom:1.25rem; font-size:0.95rem;">Your session expired or no valid code was found. Please start again.</p>
                <a th:href="@{/forgot-password}" class="btn btn-primary btn-block" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;">
                    <i class="fas fa-redo"></i> Start Over
                </a>
            </div>

            <div class="auth-footer">
                <p>Remember your password? <a th:href="@{/login}" class="text-primary font-weight-bold">Sign In</a></p>
            </div>

        </div>
    </div>

    <script>
        function togglePwd(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function checkStrength(val) {
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            const rules = {
                'rule-len':     val.length >= 8,
                'rule-upper':   /[A-Z]/.test(val),
                'rule-num':     /[0-9]/.test(val),
                'rule-special': /[^A-Za-z0-9]/.test(val)
            };
            let score = Object.values(rules).filter(Boolean).length;
            Object.entries(rules).forEach(([id, pass]) => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('pass', pass);
            });
            const levels = [
                { pct: '0%',   color: '#eef0f7', text: '' },
                { pct: '25%',  color: '#ef4444', text: 'Weak' },
                { pct: '50%',  color: '#f59e0b', text: 'Fair' },
                { pct: '75%',  color: '#3b82f6', text: 'Good' },
                { pct: '100%', color: '#0ebc7f', text: 'Strong' }
            ];
            fill.style.width    = levels[score].pct;
            fill.style.background = levels[score].color;
            label.textContent   = levels[score].text;
            label.style.color   = levels[score].color;
        }

        // Live match check
        const confirmInput = document.getElementById('confirmPassword');
        const pwdInput     = document.getElementById('password');
        if (confirmInput) {
            confirmInput.addEventListener('input', () => {
                const msg = document.getElementById('matchMsg');
                if (!confirmInput.value) { msg.textContent = ''; return; }
                if (confirmInput.value === pwdInput.value) {
                    msg.style.color = '#0ebc7f';
                    msg.textContent = '✓ Passwords match';
                } else {
                    msg.style.color = '#dc2626';
                    msg.textContent = '✗ Passwords do not match';
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Nova Learning</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Courses Header -->
<section class="page-header">
    <div class="container text-center">
        <h1>Explore Our Courses</h1>
        <p>Learn professional skills from expert instructors.</p>
    </div>
</section>

<!-- Course List -->
<section class="popular-courses py-5">
    <div class="container">

        <div class="row g-4">

            <div class="col-lg-4" th:each="c : ${allCourses}">
                <div class="course-card">
                    <div class="course-image">
                        <img th:if="${c.category == 'Computer Science'}" src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&amp;q=80" alt="Tech">
                        <img th:if="${c.category == 'Business'}" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&amp;q=80" alt="Business">
                        <img th:if="${c.category == 'Design'}" src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800&amp;q=80" alt="Design">
                        <img th:if="${c.category == 'Science'}" src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&amp;q=80" alt="Science">
                        <img th:if="${c.category != 'Computer Science' and c.category != 'Business' and c.category != 'Design' and c.category != 'Science'}" src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=800&amp;q=80" alt="Other">
                        <span class="badge" th:text="${c.category}">Category</span>
                    </div>
                    <div class="course-content">
                        <h4 th:text="${c.title}">Course Title</h4>
                        <p th:text="${c.description}">Course description</p>
                        <a th:href="@{/course/{id}(id=${c.id})}" class="view-btn">View Course</a>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div class="col-12 text-center" th:if="${allCourses == null or #lists.isEmpty(allCourses)}">
                <i class="fas fa-search fa-2x text-muted mb-3"></i>
                <h4>No courses available yet</h4>
                <p class="text-muted">Check back soon &mdash; new courses are added regularly.</p>
            </div>

        </div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/script.js"></script>
</body>
</html>

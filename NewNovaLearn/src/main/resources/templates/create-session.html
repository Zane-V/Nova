<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Live Session - NovaLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; color: #1a1a2e; min-height: 100vh; padding: 2rem 1rem; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #6b7280; text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 1.75rem; transition: color 0.2s; }
        .back-link:hover { color: #2563eb; }

        .session-form-card {
            max-width: 580px; margin: 0 auto;
            background: white; border-radius: 20px;
            padding: 3rem; box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
        }
        .form-header { text-align: center; margin-bottom: 2.5rem; }
        .form-header .icon-wrap {
            width: 64px; height: 64px; border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white; font-size: 1.6rem; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; box-shadow: 0 8px 24px rgba(37,99,235,0.3);
        }
        .form-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .form-header p { color: #6b7280; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #374151; margin-bottom: 0.5rem; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 1.25rem; color: #9ca3af; font-size: 1rem; }
        .auth-input {
            width: 100%; padding: 0.85rem 1rem 0.85rem 3rem;
            border: 1.5px solid #e5e7eb; border-radius: 12px;
            font-family: 'Outfit', sans-serif; font-size: 0.95rem;
            color: #1a1a2e; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); outline: none; }
        
        .submit-btn {
            width: 100%; padding: 0.9rem; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white; font-size: 1.05rem; font-weight: 700; font-family: 'Outfit', sans-serif;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 2rem; box-shadow: 0 4px 15px rgba(37,99,235,0.3);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.4); }

        .error-banner { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; padding: 0.85rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
        
        @media (max-width: 576px) {
            .session-form-card { padding: 2rem 1.5rem; }
            .form-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div style="max-width:580px; margin:0 auto;">
        <a th:href="@{/dashboard}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="session-form-card">
        <div class="form-header">
            <div class="icon-wrap"><i class="fas fa-broadcast-tower"></i></div>
            <h1>Host a Live Session</h1>
            <p>Generate a unique room code for an instant interactive session.</p>
        </div>

        <div th:if="${errorMessage}" class="error-banner">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${fieldErrors}" class="error-banner">
            <ul style="margin:0; padding-left:1.2rem;">
                <li th:each="err : ${fieldErrors}" th:text="${err.key} + ': ' + ${err.value}"></li>
            </ul>
        </div>

        <form th:object="${createSessionForm}" th:action="@{/create-session}" method="POST">
            <div class="form-group">
                <label for="title">Session Title</label>
                <div class="input-wrapper">
                    <i class="fas fa-heading"></i>
                    <input type="text" id="title" name="title" class="auth-input"
                           th:field="*{title}" placeholder="e.g. Intro to Machine Learning" required maxlength="120">
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Subject / Course</label>
                <div class="input-wrapper">
                    <i class="fas fa-book"></i>
                    <input type="text" id="subject" name="subject" class="auth-input"
                           th:field="*{subject}" placeholder="e.g. Computer Science 301" required maxlength="80">
                </div>
            </div>

            <div class="form-group">
                <label for="scheduledAt">Scheduled Date &amp; Time <span style="color:#9ca3af; font-weight:500;">(optional — defaults to now)</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="datetime-local" id="scheduledAt" name="scheduledAt" class="auth-input">
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-play"></i> Start Session Now
            </button>
        </form>
    </div>

</body>
</html>
